name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      publish_appcast: ${{ steps.appcast.outputs.publish }}
    env:
      REPOSITORY_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse upstream appcast publishing
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          case "$repo" in
            blimp-labs/*|*claude-usage-bar*)
              echo "::error::Refusing to publish a release from the upstream Claude Usage Bar repository."
              exit 1
              ;;
          esac
          if [[ -n "${SU_FEED_URL:-}" ]]; then
            feed="$(printf '%s' "$SU_FEED_URL" | tr '[:upper:]' '[:lower:]')"
            case "$feed" in
              *blimp-labs*|*claude-usage-bar*)
                echo "::error::Refusing SU_FEED_URL that points at the upstream appcast."
                exit 1
                ;;
            esac
          fi

      - name: Build release app bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          export APP_VERSION="$version"
          # Sparkle stays unconfigured: do not embed a feed URL.
          unset SU_FEED_URL
          bash macos/scripts/build.sh

      - name: Package and verify release artifacts
        run: |
          bash macos/scripts/build.sh --skip-build --zip --dmg
          make verify-release

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/archives dist/site

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq '.body' > dist/release-notes.md

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with open("dist/release-notes.md", "r", encoding="utf-8") as fh:
              markdown = fh.read()

          request = urllib.request.Request(
              "https://api.github.com/markdown",
              data=json.dumps({
                  "text": markdown,
                  "mode": "gfm",
                  "context": os.environ["GITHUB_REPOSITORY"],
              }).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )

          with urllib.request.urlopen(request) as response:
              html = response.read().decode("utf-8")

          with open("dist/archives/GrokUsageBar.html", "w", encoding="utf-8") as fh:
              fh.write(html)
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/GrokUsageBar.zip
            macos/GrokUsageBar.dmg
          body_path: dist/release-notes.md

      - name: Generate Sparkle appcast
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          case "$repo" in
            blimp-labs/*|*claude-usage-bar*)
              echo "::error::Refusing to generate an appcast for the upstream repository."
              exit 1
              ;;
          esac
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "Sparkle is unconfigured (no SPARKLE_PRIVATE_KEY). Skipping the appcast."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${SU_FEED_URL:-}" ]]; then
            feed="$(printf '%s' "$SU_FEED_URL" | tr '[:upper:]' '[:lower:]')"
            case "$feed" in
              *blimp-labs*|*claude-usage-bar*)
                echo "::error::Refusing to publish an upstream appcast."
                exit 1
                ;;
            esac
          fi

          cp macos/GrokUsageBar.zip dist/archives/GrokUsageBar.zip
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            macos/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              dist/archives \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --maximum-deltas 0 \
              -o dist/site/appcast.xml
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Upload appcast for GitHub Pages
        if: steps.appcast.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy_appcast:
    needs: release
    if: needs.release.outputs.publish_appcast == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy appcast
        id: deployment
        uses: actions/deploy-pages@v4
