name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cd macos && swift build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: cd macos && swift test

      - name: Upload pet snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pet-snapshots
          path: macos/.build/pet-snapshots/*.png
          if-no-files-found: ignore
