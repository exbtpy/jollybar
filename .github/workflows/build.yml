name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cd macos && swift build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: cd macos && swift test
